[project]
name = "vsphere-mcp"
version = "0.1.0"
description = "Read-only MCP server over vCenters and vROps, for diagnosing VMs that did not come back"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1,<3",
    "pyvmomi>=8.0.2",
    "httpx>=0.27",
    "pydantic-settings>=2.3,<3",
    "typer>=0.18,<1",
    "pillow>=10",
]

[project.optional-dependencies]
# OCR of the console screen. Needs the tesseract binary on PATH as well.
ocr = ["pytesseract>=0.3.10"]
dev = ["pytest>=8", "ruff>=0.16.7,<0.17"]

[project.scripts]
vsphere-mcp = "vsphere_mcp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vsphere_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs Docker and the vmware/vcsim image"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The formatter decides these.
    "COM812",
    "ISC001",
    # Each contradicts a rule kept: D211 and D212 win.
    "D203",
    "D213",
    "CPY001",
    "TRY003",
    "EM101",
    "EM102",
    # pyVmomi objects are untyped; `Any` at that boundary is the truth.
    "ANN401",
    # Docstrings here name what a function returns ("The VMs in a folder"),
    # which reads better for a reader of results than an imperative verb.
    "D401",
]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.isort]
known-first-party = ["vsphere_mcp"]
known-third-party = ["mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D100", "D101", "D102", "D103", "D104", "D107", "PLR2004", "SLF001", "INP001", "S105", "S106", "S603", "S607", "S310", "S311", "ARG001", "PLR0913", "FBT001", "FBT003", "C901", "PLR0915"]

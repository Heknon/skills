[project]
name = "shop"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9", "mypy==2.3.1", "httpx2==2.13.1"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

[tool.mypy]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

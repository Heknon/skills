include:
  - local: ci/build.yml
  - project: platform/templates
    ref: v1.0.0
    file: /python.yml
  - project: platform/templates
    file: /common.yml
  - component: $CI_SERVER_FQDN/platform/ci-components/python-checks@1.3.0
    inputs:
      job-prefix: disc
      python-image: $PYTHON_IMAGE
  - template: Jobs/Code-Quality.gitlab-ci.yml
    rules:
      - if: $RUN_CODE_QUALITY == "true"
  - local: ci/deploy.yml
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [test, build, deploy, downstream]

unit:
  extends: .python-base
  stage: test
  script:
    - !reference [.login, script]
    - echo "unit tests"

child:
  stage: downstream
  trigger:
    include: ci/child.yml
    strategy: mirror

generate:
  stage: build
  script:
    - printf 'generated-job:\n  script:\n    - echo generated\n' > generated.yml
  artifacts:
    paths: [generated.yml]

dynamic-child:
  stage: downstream
  needs: [generate]
  trigger:
    include:
      - artifact: generated.yml
        job: generate
    strategy: mirror

charts-pipeline:
  stage: downstream
  trigger:
    project: platform/charts
    branch: main

stages: [test, deploy]

test:
  stage: test
  image: registry.example.com/mirror/astral-sh/uv:0.12-python3.12-trixie-slim
  script:
    - uv sync --locked
    - uv run pytest
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

deploy-staging:
  stage: deploy
  image: registry.example.com/mirror/alpine/helm:4.3.0
  script:
    - helm upgrade --install web ./chart -n shop-staging --wait
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

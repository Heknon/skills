stages: [test]

lint:
  stage: test
  image: registry.example.com/mirror/astral-sh/uv:0.12-python3.12-trixie-slim
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --locked
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  image: registry.example.com/mirror/astral-sh/uv:0.12-python3.12-trixie-slim
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --locked
  script:
    - uv run pytest --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml

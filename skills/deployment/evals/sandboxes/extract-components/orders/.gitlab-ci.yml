stages: [check]

ruff:
  stage: check
  image: registry.example.com/mirror/astral-sh/uv:0.12-python3.12-trixie-slim
  before_script:
    - uv sync --locked
  script:
    - uv run ruff check src tests

pytest:
  stage: check
  image: registry.example.com/mirror/astral-sh/uv:0.12-python3.12-trixie-slim
  before_script:
    - uv sync --locked
  script:
    - uv run pytest -x --junitxml=report.xml
  artifacts:
    reports:
      junit: report.xml

variables:
  HELM_IMAGE: registry.example.com/mirror/alpine/helm:3.19.0

deploy-staging:
  image:
    name: $HELM_IMAGE
    entrypoint: [""]
  environment:
    name: staging
  script:
    - helm upgrade --install web ./chart -n shop-staging --atomic --force --timeout 10m
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

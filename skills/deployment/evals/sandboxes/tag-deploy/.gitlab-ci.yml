workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [deploy]

deploy-production:
  stage: deploy
  image:
    name: registry.example.com/mirror/alpine/helm:4.3.0
    entrypoint: [""]
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  script:
    - helm upgrade --install web ./chart -n shop-production --wait --rollback-on-failure

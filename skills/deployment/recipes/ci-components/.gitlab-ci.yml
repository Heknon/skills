# Recipe: pipeline of the CI/CD components project itself.
# Every pipeline includes each component from this very commit and runs it against
# the sample project in tests/. A tag X.Y.Z whose pipeline passes creates a release,
# which is the version other projects include: component: .../python-checks@X.Y.Z
# Change: the two images to your mirror.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  PYTHON_IMAGE: registry.example.com/mirror/astral-sh/uv:0.12-python3.12-trixie-slim
  RELEASE_IMAGE: registry.example.com/mirror/gitlab-org/cli:v1.119.0

stages: [test, build, verify, release]

include:
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/python-checks@$CI_COMMIT_SHA
    inputs:
      job-prefix: sample
      working-directory: tests/python-app
      python-image: $PYTHON_IMAGE
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/python-publish@$CI_COMMIT_SHA
    inputs:
      job-prefix: sample
      stage: build
      working-directory: tests/python-app
      python-image: $PYTHON_IMAGE
  - component: $CI_SERVER_FQDN/$CI_PROJECT_PATH/helm-deploy@$CI_COMMIT_SHA
    inputs:
      job-name: sample-deploy
      stage: verify
      environment: sample
      namespace: sample
      release: sample
      chart-version: 1.0.0
      chart-project-id: "0"
      when: manual

# The deploy component is only checked for shape here: its job must exist and be manual.
components-present:
  stage: verify
  image: $PYTHON_IMAGE
  script:
    - |
      python3 - <<'PY'
      import json, os, urllib.request
      url = f"{os.environ['CI_API_V4_URL']}/projects/{os.environ['CI_PROJECT_ID']}/pipelines/{os.environ['CI_PIPELINE_ID']}/jobs?per_page=100"
      jobs = {j["name"]: j["status"] for j in json.load(urllib.request.urlopen(urllib.request.Request(url, headers={"JOB-TOKEN": os.environ["CI_JOB_TOKEN"]})))}
      print(jobs)
      assert jobs.get("sample-deploy") == "manual", "sample-deploy missing or not manual"
      assert "sample-lint" in jobs and "sample-test" in jobs, "python-checks jobs missing"
      PY

release:
  stage: release
  image: $RELEASE_IMAGE
  rules:
    - if: $CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: Components $CI_COMMIT_TAG

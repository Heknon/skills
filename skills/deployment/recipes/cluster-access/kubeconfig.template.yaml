# Recipe: the kubeconfig stored in the GitLab File variable KUBECONFIG.
# Fill the four <...> values (core/access.md shows the commands that print them),
# save, and paste the whole file as the variable's value. Never commit the filled file.
apiVersion: v1
kind: Config
clusters:
  - name: cluster
    cluster:
      server: <API server URL, such as https://api.cluster.example.com:6443>
      certificate-authority-data: <base64 CA bundle, the Secret's ca.crt as it is stored>
users:
  - name: gitlab-deployer
    user:
      token: <the Secret's token, decoded>
contexts:
  - name: deploy
    context:
      cluster: cluster
      user: gitlab-deployer
      namespace: <namespace>
current-context: deploy

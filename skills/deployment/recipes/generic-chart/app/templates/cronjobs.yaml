{{- range $name, $job := .Values.cronJobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "app.fullname" $ | trunc 40 | trimSuffix "-" }}-{{ $name | trunc 12 | trimSuffix "-" }}
  labels:
    {{- include "app.labels" $ | nindent 4 }}
spec:
  schedule: {{ $job.schedule | quote }}
  suspend: {{ $job.suspend | default false }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ $.Release.Name }}
            app.kubernetes.io/component: {{ $name | trunc 63 | trimSuffix "-" }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "app.serviceAccountName" $ }}
          {{- with $.Values.imagePullSecrets }}
          imagePullSecrets:
            {{- range . }}
            - name: {{ . }}
            {{- end }}
          {{- end }}
          securityContext:
            {{- include "app.podSecurityContext" $ | nindent 12 }}
          containers:
            {{- include "app.jobContainer" (dict "root" $ "command" $job.command "args" $job.args) | nindent 12 }}
          {{- include "app.volumes" $ | nindent 10 }}
{{- end }}

# Recipe: pipeline for one Python service managed by uv, deployed with the generic chart.
# Copy whole, with Dockerfile, .dockerignore and deploy/. Change: the variables block.
# What it does:
#   merge request, branch  lint, test
#   default branch         lint, test, build-image, deploy to staging
#   tag vX.Y.Z             lint, test, build-image (reused, tagged vX.Y.Z), deploy to production by hand
# Needs, set once by a Maintainer (core/variables.md, core/access.md):
#   KUBECONFIG  File variable, protected, one per environment scope (staging, production),
#               holding the kubeconfig of a deployer service account in that namespace.
#   The chart project allows this project in its CI/CD job token allowlist.
#   Protected tags v*, so the protected production KUBECONFIG reaches tag pipelines only.
#   Optional, Premium: a protected environment "production" with its approvers.
#   A private registry: a pull secret in each namespace, named in imagePullSecrets.
# Optional File variables, usually set once for the whole instance or group:
#   INTERNAL_CA   the internal CA certificate (PEM), when the package index uses it
#   INDEX_NETRC   .netrc lines with credentials for a private package index

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  auto_cancel:
    on_new_commit: interruptible

variables:
  # Images, from the internal mirror.
  PYTHON_IMAGE: registry.example.com/mirror/astral-sh/uv:0.12-python3.12-trixie-slim
  BASE_IMAGE: registry.example.com/mirror/library/python:3.12-slim-trixie
  BUILDAH_IMAGE: registry.example.com/mirror/buildah/stable:v1.43
  HELM_IMAGE: registry.example.com/mirror/alpine/helm:4.3.0
  # The generic chart: project id of the chart project, and the chart version.
  CHART_PROJECT_ID: "0"
  CHART_VERSION: "1.0.0"
  # The release name, which names every object in the namespace.
  RELEASE: $CI_PROJECT_NAME
  IMAGE: $CI_REGISTRY_IMAGE
  UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  UV_LINK_MODE: copy
  UV_PYTHON_DOWNLOADS: never

stages: [check, build, deploy]

default:
  interruptible: true

.uv:
  image: $PYTHON_IMAGE
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache]
  before_script:
    - uv sync --locked
  after_script:
    - uv cache prune --ci

lint:
  extends: .uv
  stage: check
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  extends: .uv
  stage: check
  script:
    - uv run pytest --junitxml=report.xml --cov --cov-report=term --cov-report=xml:coverage.xml
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# One image per commit, tagged with the full commit SHA and never rebuilt.
# A tag pipeline finds the image its commit already has and adds the version tag.
build-image:
  stage: build
  image: $BUILDAH_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    STORAGE_DRIVER: vfs
    BUILDAH_ISOLATION: chroot
    BUILDAH_FORMAT: docker
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | buildah login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      if buildah pull --quiet "$IMAGE:$CI_COMMIT_SHA" > /dev/null 2>&1; then
        echo "image for $CI_COMMIT_SHA exists, not rebuilding"
      else
        secrets=""
        if [ -n "$INTERNAL_CA" ]; then secrets="$secrets --secret id=ca,src=$INTERNAL_CA"; fi
        if [ -n "$INDEX_NETRC" ]; then secrets="$secrets --secret id=netrc,src=$INDEX_NETRC"; fi
        buildah build $secrets \
          --build-arg UV_IMAGE="$PYTHON_IMAGE" --build-arg PYTHON_IMAGE="$BASE_IMAGE" \
          --label org.opencontainers.image.revision="$CI_COMMIT_SHA" \
          --label org.opencontainers.image.source="$CI_PROJECT_URL" \
          --tag "$IMAGE:$CI_COMMIT_SHA" .
      fi
    - buildah push --digestfile image.digest "$IMAGE:$CI_COMMIT_SHA"
    - if [ -n "$CI_COMMIT_TAG" ]; then buildah push "$IMAGE:$CI_COMMIT_SHA" "docker://$IMAGE:$CI_COMMIT_TAG"; fi
    - echo "IMAGE_DIGEST=$(cat image.digest)" > image.env
    - cat image.env
  artifacts:
    reports:
      dotenv: image.env

.deploy:
  stage: deploy
  image:
    name: $HELM_IMAGE
    entrypoint: [""]
  needs: [build-image]
  # A deploy that started must finish: a newer pipeline does not cancel it,
  # and two deploys to one environment never run at once.
  interruptible: false
  resource_group: deploy-$DEPLOY_ENV
  script:
    - echo "$CI_JOB_TOKEN" | helm repo add platform
      "$CI_API_V4_URL/projects/$CHART_PROJECT_ID/packages/helm/stable"
      --username gitlab-ci-token --password-stdin
    - helm upgrade --install "$RELEASE" platform/app --version "$CHART_VERSION"
      --namespace "$KUBE_NAMESPACE"
      --values deploy/values.yaml --values "deploy/values-$DEPLOY_ENV.yaml"
      --set-string image.repository="$IMAGE"
      --set-string image.tag="$CI_COMMIT_SHA"
      --set-string image.digest="$IMAGE_DIGEST"
      --wait --timeout 10m --rollback-on-failure --history-max 10
    - helm history "$RELEASE" --namespace "$KUBE_NAMESPACE" --max 3

deploy-staging:
  extends: .deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    DEPLOY_ENV: staging
    KUBE_NAMESPACE: shop-staging
  environment:
    name: staging
    url: https://web-shop-staging.apps.example.com
    deployment_tier: staging

deploy-production:
  extends: .deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  variables:
    DEPLOY_ENV: production
    KUBE_NAMESPACE: shop-production
  environment:
    name: production
    url: https://web.example.com
    deployment_tier: production

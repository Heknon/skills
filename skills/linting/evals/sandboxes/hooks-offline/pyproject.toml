[project]
name = "inventory"
version = "0.1.0"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff==0.16.9", "mypy==2.3.1", "pre-commit==4.6.2", "pre-commit-hooks==6.0.0"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
strict = true

[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["legacy-utils"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
legacy-utils = { path = "libs/legacy_utils", editable = true }

[dependency-groups]
dev = ["mypy==2.3.1"]

[tool.mypy]
strict = true

[project]
name = "finance-reports"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["reportjob==1.0.0"]

# The wheelhouse stands in for packages the internal mirror serves.
[[tool.uv.index]]
name = "wheelhouse"
url = "./wheels"
format = "flat"
explicit = true

[tool.uv.sources]
reportjob = { index = "wheelhouse" }

[project]
name = "acme-reports"
version = "2.4.0"
requires-python = ">=3.12"
dependencies = ["click>=8.1", "pydantic>=2.13"]

[project.scripts]
acme-reports = "acme_reports.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[[tool.uv.index]]
name = "mirror"
url = "https://pypi-mirror.example.com/simple"
default = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "acme-platform"
version = "3.2.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.28",
    "pydantic>=2.13",
]

[project.scripts]
acme-api = "acme_api.cli:main"
acme-worker = "acme_worker.cli:main"

[dependency-groups]
dev = ["pytest>=9"]

[[tool.uv.index]]
name = "mirror"
url = "https://pypi-mirror.example.com/simple"
default = true

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_api", "src/acme_worker", "src/acme_shared"]

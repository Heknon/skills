build-wheel:
  image: registry.example.com/mirror/astral-sh/uv:0.12-python3.12-trixie-slim
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    GIT_STRATEGY: none
    UV_PYTHON_DOWNLOADS: never
  script:
    - git clone --depth 1 --no-tags "$CI_REPOSITORY_URL" build
    - cd build
    - uv build
  artifacts:
    paths: [build/dist/]

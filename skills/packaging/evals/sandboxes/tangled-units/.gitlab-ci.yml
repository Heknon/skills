variables:
  PYTHONPATH: "$CI_PROJECT_DIR"

default:
  image: python:3.12-slim
  before_script:
    - pip install -r requirements.txt

test-api:
  script:
    - pytest api/tests

test-worker:
  script:
    - pytest worker/tests

build-api:
  script:
    - buildah bud -f api/Dockerfile -t acme-api .

build-worker:
  script:
    - buildah bud -f worker/Dockerfile -t acme-worker .

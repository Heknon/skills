[project]
name = "acme-api"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "acme-core",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.uv.sources]
acme-core = { workspace = true }

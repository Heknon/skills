[project]
name = "acme-tools"
version = "0.2.0"
description = "Small command-line tools for the operations team."
requires-python = ">=3.12"
dependencies = ["click>=8.1"]

[project.scripts]
acme = "acme.cli:make_cli"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme"]

[dependency-groups]
dev = ["pytest>=8.4"]

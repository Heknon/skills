default:
  image: registry.example.com/mirror/astral-sh/uv:0.12.19-python3.12-trixie-slim
  before_script:
    - uv sync --locked

test-api:
  script:
    - uv run pytest api/tests

test-worker:
  script:
    - uv run pytest worker/tests

build-api:
  script:
    - buildah bud -f api/Dockerfile -t acme-api .

build-worker:
  script:
    - buildah bud -f worker/Dockerfile -t acme-worker .

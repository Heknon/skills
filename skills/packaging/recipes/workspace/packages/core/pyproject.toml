[project]
name = "acme-core"
version = "1.2.0"
description = "Shared money helpers."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# acme/ is a namespace shared with other members: it has no __init__.py.
packages = ["src/acme"]

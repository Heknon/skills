[project]
name = "acme-api"
version = "0.4.0"
description = "Order totals over the command line."
requires-python = ">=3.12"
dependencies = [
    # Bounded: this is what the published wheel will require.
    "acme-core>=1.2,<2",
    "click>=8.1",
]

[project.scripts]
acme-api = "acme.api:main"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme"]

[tool.uv.sources]
acme-core = { workspace = true }

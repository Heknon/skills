[project]
name = "billing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5"]

[dependency-groups]
dev = ["pytest>=8.4", "pyright==1.1.414"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

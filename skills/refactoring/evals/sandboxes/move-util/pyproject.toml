[project]
name = "app"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
app-import = "app.importer:main"

[project.entry-points."app.parsers"]
date = "app.helpers:parse_date"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.16", "mypy>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B"]

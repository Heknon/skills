[project]
name = "orders"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.141", "pydantic>=2.13"]

[dependency-groups]
dev = ["pytest>=9.1", "httpx2", "ruff>=0.16", "mypy>=2.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "B"]
